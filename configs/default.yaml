# Shared configuration for all heads (CLAUDE.md §7). The `features` section and
# training.lr were selected on validation only and are FROZEN: do not edit by hand.
features:
  tfidf_dim: 256
  chargram_dim: 256
  stats_dim: 6
  selection:
    selected_on: k-matched VALIDATION splits only; test never opened
    date: '2026-10-11'
    git_commit: 44bd2241d474f5245505b9b983021ca32ddc9371
    working_tree_clean: true
    script: scripts/select_feature_dims.py
    report: results/tables/feature_dim_selection.md
    scores: results/selection/feature_dims/scores.json
    method: handcrafted branch alone (multinomial logistic regression on h_feat),
      val Macro-F1
    grid_final:
      tfidf_dim:
      - 128
      - 256
      - 512
      - 1024
      chargram_dim:
      - 128
      - 256
      - 512
      - 1024
      - 2048
    bracketing_rounds: 2
    bracketed: true
    cells:
      tracks:
      - bnintent30-bn
      - bnintent30-en
      k:
      - '5'
      - full
      seeds:
      - 13
      - 42
      - 87
      - 100
      - 2026
      n_seeds: 5
    rule: smallest tfidf_dim + chargram_dim with mean >= best mean - SD(best over
      seeds); extend a dimension downward while the choice sits on its lower edge
    best:
      tfidf_dim: 256
      chargram_dim: 2048
      mean_val_macro_f1: 0.71
    sd_best: 0.0123
    chosen_mean_val_macro_f1: 0.6992
    plateau: 12 of 20 configurations lie within one SD (0.0123) of the best; mean
      validation Macro-F1 spans 0.6778-0.7100 across the whole grid (a range of 0.0322).
    history: '2026-10-11: 3x3 grid, seeds 13/42 -> 256/1024; 3x3 grid, 5 seeds ->
      256/512 (both from uncommitted trees); this run supersedes them'
heads:
  order:
  - baseline
  - concat
  - sagff
  - concat-cap
  - baseline-cap
  d_model: 768
  feat_dim: 518
  dropout: 0.1
  gate_bias_init: 0.0
  gate_bias_init_note: explicit constant for W_g's bias so g ~ 0.5 at init; W_g weights
    keep PyTorch default init under the run seed
  baseline_cap_hidden: 1024
  concat_cap_hidden: 512
  matching:
    baseline-cap: parameter count within 20% of sagff (src.models, widths rounded
      to a multiple of 64)
    concat-cap: parameter count within 1% of sagff (src.models, widths rounded to
      a multiple of 64)
  param_counts:
    baseline:
      30_classes: 24606
      77_classes: 60749
    concat:
      30_classes: 447774
      77_classes: 520013
    sagff:
      30_classes: 1605150
      77_classes: 1641293
    concat-cap:
      30_classes: 1607198
      77_classes: 1643341
    baseline-cap:
      30_classes: 1600798
      77_classes: 1636941
training:
  optimizer: AdamW
  lr: 0.003
  weight_decay: 0.01
  batch_size: 32
  grad_clip: 1.0
  max_epochs: 200
  patience: 20
  lr_schedule: constant
  selection_metric: Macro-F1 on the k-matched validation split (val.jsonl)
  loss: cross-entropy
  threads: 6
  tuning_note: identical for every head, condition, track and regime; no per-head
    or per-regime tuning. lr selected once on validation with the baseline head only.
  lr_selection:
    selected_on: k-matched VALIDATION splits only; test never loaded
    head: baseline ONLY; applied unchanged to every head and regime
    date: '2026-10-12'
    git_commit: 7e7f8f6443751f41649160f22874f88902f6dd38
    working_tree_clean: true
    grid_final:
    - 0.0003
    - 0.001
    - 0.003
    - 0.01
    bracketing_rounds: 1
    bracketed: true
    rule: highest mean val Macro-F1 over all cells; extend the grid while the winner
      is an edge
    cells:
      tracks:
      - bnintent30-bn
      - bnintent30-en
      - banking77
      k:
      - '5'
      - '10'
      - '20'
      - full
      seeds:
      - 13
      - 42
      - 87
      - 100
      - 2026
    mean_val_macro_f1:
      '0.0003': 0.7722
      '0.001': 0.7966
      '0.003': 0.7997
      '0.01': 0.7988
    script: scripts/select_lr.py
    report: results/tables/lr_selection.md
    runs: results/selection/lr/
    history: '2026-10-11: grid {3e-4,1e-3,3e-3} -> 3e-3, run from an uncommitted tree
      (logs in results/selection/lr_218bd44_uncommitted/); this run supersedes it'
  converged_loss_threshold: 0.01
